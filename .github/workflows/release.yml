name: Release

# 推送 vX.Y.Z 标签后：GitHub 云端构建 Windows 安装包 + 便携版，生成校验和并创建 Release。
# 本地只需要 npm run release <版本>（改版本、打 tag、推送），产物全部由这里生成。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建主进程 / 渲染层
        run: |
          node scripts/check-renderer.mjs
          npx electron-vite build

      - name: 打包 NSIS 安装包 + 便携版
        run: npx electron-builder

      - name: 生成 SHA256SUMS.txt
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: 提取本版更新说明（取自 CHANGELOG 对应段落）
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $all = Get-Content CHANGELOG.md -Encoding utf8
          $si = -1
          for ($i = 0; $i -lt $all.Count; $i++) { if ($all[$i].Contains("## [$ver]")) { $si = $i; break } }
          if ($si -lt 0) {
            "本次版本更新内容详见仓库 CHANGELOG.md。" | Set-Content release-notes.md -Encoding utf8
          } else {
            $ei = $all.Count
            for ($j = $si + 1; $j -lt $all.Count; $j++) { if ($all[$j] -match '^## \[') { $ei = $j; break } }
            ($all[($si + 1)..($ei - 1)] -join "`n") | Set-Content release-notes.md -Encoding utf8
          }
          Get-Content release-notes.md

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }}
          release/*.exe release/*.blockmap release/latest.yml release/SHA256SUMS.txt
          --title "兰台 ${{ github.ref_name }}"
          --notes-file release-notes.md
